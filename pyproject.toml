[tool.poetry]
name = "autoclip"
version = "0.1.0"
description = "AI-powered automatic video clip & narration generator (MVP)"
authors = ["六饼 <mcfell.yc@alibaba-inc.com>"]
readme = "README.md"
packages = [{include = "autoclip", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

# === Web Framework ===
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
python-multipart = "^0.0.18"
jinja2 = "^3.1.4"
markdown = "^3.7"

# === Data & ORM ===
sqlalchemy = "^2.0.36"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"

# === LLM / ASR / TTS Providers ===
dashscope = "^1.20.0"  # Tongyi Qianwen LLM
faster-whisper = "^1.0.0"  # Local ASR (v0.4 ADR-004 三度修订, design.md Part IV §21.1)
# Volcengine TTS uses raw HTTP API (no dedicated SDK needed)

# === Media Processing ===
scenedetect = {extras = ["opencv"], version = "^0.6.5"}
ffmpeg-python = "^0.2.0"

# === Jianying Draft Export ===
pyjianyingdraft = "^0.2.0"  # Community lib; JsonTimelineExporter as fallback (R1)

# === Utilities ===
loguru = "^0.7.2"
tenacity = "^9.0.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.7.0"
mypy = "^1.13.0"


[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "integration: integration tests (may require external services)",
    "slow: slow tests (skip by default in dev)",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/autoclip"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line too long handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
